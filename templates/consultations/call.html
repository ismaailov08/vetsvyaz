{% extends "base.html" %}
{% block title %}Видеозвонок{% endblock %}
{% block content %}
<section class="call">
  <div class="video main"><span>{% if user.is_farmer %}{{ c.vet }}{% else %}{{ c.farmer }}{% endif %}</span></div>
  <div class="video self"><span>Вы</span></div>
  <div class="call-bar"><span id="timer">00:00</span>
    <button class="round">🎤</button><button class="round">📷</button>
    <a class="round danger" href="{{ c.get_absolute_url }}">✕</a></div>
</section>
{% endblock %}
{% block scripts %}<script>startTimer("timer")</script>{% endblock %}

{# Универсальное всплывающее окно: id, title, action, form, submit #}
<dialog class="modal" id="{{ id }}">
  <form method="post" action="{{ action }}" class="modal-body">
    {% csrf_token %}
    <header><h3>{{ title }}</h3><button type="button" class="x" data-close>×</button></header>
    {% for field in form %}{% include "includes/_field.html" %}{% endfor %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <footer><button type="button" class="btn ghost" data-close>Отмена</button>
      <button class="btn">{{ submit|default:"Сохранить" }}</button></footer>
  </form>
</dialog>
